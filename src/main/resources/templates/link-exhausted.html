<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><span th:text="${title}">Link Inaccessible</span> - PreonsURL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border-light: #e2e8f0;
            --btn-bg: #0f172a;
            --btn-hover: #1e293b;
            --btn-text: #ffffff;
            --accent-glow: rgba(15, 23, 42, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background-image: 
                radial-gradient(circle at 10% 15%, rgba(226, 232, 240, 0.5) 0%, transparent 40%),
                radial-gradient(circle at 90% 85%, rgba(226, 232, 240, 0.5) 0%, transparent 40%);
        }

        .card {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 44px 36px 32px;
            box-shadow: 0 20px 45px -15px rgba(0, 0, 0, 0.07), 0 0 1px 1px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.05);
            text-align: center;
            animation: cardAppear 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            background: #f1f5f9;
            border: 1px solid var(--border-light);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 22px;
        }

        .status-badge-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #ef4444;
        }

        .icon-aura-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: radial-gradient(circle, #f1f5f9 0%, #f8fafc 65%, transparent 72%);
            margin-bottom: 20px;
        }

        .icon-badge {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: linear-gradient(135deg, #334155 0%, #0f172a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            box-shadow: 0 10px 20px -4px rgba(15, 23, 42, 0.2);
        }

        .icon-badge svg {
            width: 24px;
            height: 24px;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.025em;
            margin-bottom: 8px;
        }

        p.description {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .info-box {
            background: #f8fafc;
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 28px;
            text-align: left;
        }

        .action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            height: 48px;
            background: var(--btn-bg);
            color: var(--btn-text);
            border-radius: 12px;
            font-size: 14.5px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background: var(--btn-hover);
            transform: translateY(-1px);
        }

        .action-btn svg {
            width: 16px;
            height: 16px;
        }

        .footer {
            margin-top: 24px;
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <main class="card" id="exhausted-container">
        <div class="status-badge" id="exhausted-status-badge">
            <span class="status-badge-dot"></span>
            <span th:text="${badge}">Limit Reached</span>
        </div>

        <div>
            <div class="icon-aura-wrapper">
                <div class="icon-badge">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                </div>
            </div>
        </div>

        <h1 id="exhausted-title" th:text="${title}">Link Inaccessible</h1>
        <p class="description" id="exhausted-description" th:text="${description}">This link is no longer accessible.</p>

        <div class="info-box">
            This URL has reached the end of its active lifecycle. If you believe this is an error, please contact the individual or organization who shared this link with you.
        </div>

        <a href="/" class="action-btn" id="home-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 12 15 12 15 22"></polyline>
            </svg>
            <span>Return to Homepage</span>
        </a>

        <footer class="footer">
            PreonsURL Gateway Service
        </footer>
    </main>
</body>
</html>
