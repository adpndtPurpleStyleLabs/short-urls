<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Password to Continue - Password Protected Link - SecureURLs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #ffffff;
            --surface-card: #ffffff;
            --border-subtle: #e4e4e7;
            --border-medium: #d4d4d8;
            --border-focus: #000000;
            --text-pure: #000000;
            --text-high: #09090b;
            --text-muted: #52525b;
            --text-subtle: #71717a;
            --accent-glow: rgba(0, 0, 0, 0.08);
            --accent-glow-strong: rgba(0, 0, 0, 0.18);
            --error-bg: #fef2f2;
            --error-border: #fca5a5;
            --error-text: #991b1b;
            --success-bg: #f4f4f5;
            --success-border: #18181b;
            --success-text: #09090b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Manrope", sans-serif;
            font-weight: 500;
            background-color: var(--bg-canvas);
            color: var(--text-pure);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
            position: relative;
            overflow-x: hidden;
            background-image:
                radial-gradient(ellipse 70% 40% at 50% -10%, rgba(0, 0, 0, 0.03) 0%, transparent 70%),
                radial-gradient(ellipse 60% 40% at 50% 110%, rgba(0, 0, 0, 0.02) 0%, transparent 60%);
        }

        /* Ambient Geometric Grid */
        .ambient-grid {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image: linear-gradient(to right, rgba(0, 0, 0, 0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(0, 0, 0, 0.03) 1px, transparent 1px);
            background-size: 56px 56px;
            mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
            z-index: 0;
        }

        /* Luxury White Card Container */
        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 390px;
            background: var(--surface-card);
            border-radius: 16px;
            padding: 42px 28px 30px;
            box-shadow:
                0 0 0 1px rgba(0, 0, 0, 0.03),
                0 16px 36px -10px rgba(0, 0, 0, 0.08),
                0 1px 3px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--border-medium);
            text-align: center;
            animation: cardAppear 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardAppear {
            0% {
                opacity: 0;
                transform: translateY(12px) scale(0.99);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Lock Icon Halo */
        .icon-aura-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: radial-gradient(circle, #f4f4f5 0%, #fafafa 70%, transparent 72%);
            margin-bottom: 20px;
            position: relative;
        }

        .lock-badge {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            box-shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.18);
        }

        .lock-badge svg {
            width: 18px;
            height: 18px;
        }

        .sparkle-dot {
            display: none;
        }

        /* Typography */
        h1 {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--text-pure);
            letter-spacing: -0.02em;
            margin-bottom: 6px;
        }

        p.subtitle {
            font-size: 12.5px;
            color: var(--text-muted);
            line-height: 1.45;
            max-width: 320px;
            margin: 0 auto 24px;
        }

        /* Error Alert */
        .alert {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 12px;
            border-radius: 8px;
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            color: var(--error-text);
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 20px;
            text-align: left;
        }

        .alert svg {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .error-shake {
            animation: shake 0.4s ease-in-out;
        }

        /* Password Input Field */
        .password-input-wrapper {
            display: flex;
            align-items: center;
            height: 42px;
            border: 1px solid var(--border-medium);
            border-radius: 8px;
            padding: 0 12px;
            background: #ffffff;
            transition: all 0.2s ease;
            margin-bottom: 22px;
        }

        .password-input-wrapper:focus-within {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 1px #000000, 0 0 12px var(--accent-glow);
        }

        .input-icon-left {
            width: 15px;
            height: 15px;
            color: var(--text-muted);
            flex-shrink: 0;
            margin-right: 10px;
        }

        .password-field {
            flex: 1;
            height: 100%;
            border: none;
            outline: none;
            font-family: inherit;
            font-size: 13.5px;
            color: var(--text-pure);
            background: transparent;
        }

        .password-field::placeholder {
            color: #a1a1aa;
            font-weight: 400;
        }

        .input-divider {
            width: 1px;
            height: 18px;
            background: var(--border-subtle);
            margin: 0 6px;
        }

        .eye-toggle-btn {
            background: none;
            border: none;
            padding: 3px;
            cursor: pointer;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s ease;
        }

        .eye-toggle-btn:hover {
            color: var(--text-pure);
        }

        .eye-toggle-btn svg {
            width: 15px;
            height: 15px;
        }

        /* Submit Button */
        .unlock-btn {
            width: 100%;
            height: 40px;
            background: #000000;
            color: #ffffff;
            border: 1px solid #000000;
            border-radius: 8px;
            padding: 0 16px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .unlock-btn:hover {
            background: #18181b;
            transform: translateY(-1px);
            box-shadow: 0 4px 14px var(--accent-glow-strong);
        }

        .unlock-btn:active {
            transform: translateY(0);
        }

        .unlock-btn svg {
            width: 14px;
            height: 14px;
            transition: transform 0.2s ease;
        }

        .unlock-btn:hover svg {
            transform: translateX(3px);
        }

        /* Help link */
        .help-container {
            margin: 16px 0 24px;
        }

        .help-link {
            font-size: 12px;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .help-link:hover {
            color: var(--text-pure);
            text-decoration: underline;
        }

        /* Divider & Badges Footer */
        .badges-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding-top: 18px;
            border-top: 1px solid var(--border-subtle);
        }

        .badge-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: var(--text-subtle);
            font-weight: 500;
        }

        .badge-item svg {
            width: 12px;
            height: 12px;
            color: var(--text-subtle);
        }

        .badge-divider {
            width: 1px;
            height: 12px;
            background: var(--border-subtle);
        }

        @media (max-width: 440px) {
            .card {
                padding: 32px 20px 24px;
            }
            .badges-footer {
                flex-direction: column;
                gap: 6px;
            }
            .badge-divider {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Ambient Geometric Grid -->
    <div class="ambient-grid" aria-hidden="true"></div>

    <!-- Main Card -->
    <main class="card" id="password-challenge-card">
        <!-- Lock Aura -->
        <div class="icon-aura-wrapper">
            <div class="sparkle-dot sparkle-1"></div>
            <div class="sparkle-dot sparkle-2"></div>
            <div class="lock-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>
        </div>

        <h1 id="password-title">Enter Password to Continue</h1>
        <p class="subtitle" id="password-subtitle">This link is password protected. Please enter the password to access the content.</p>

        <!-- Error Alert -->
        <div th:if="${errorMessage != null and !errorMessage.isEmpty()}" class="alert error-shake" id="error-alert">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span th:text="${errorMessage}">Invalid password entered. Please try again.</span>
        </div>

        <!-- Password Form -->
        <form method="POST" th:action="${'/' + targetPath + '/verify'}" id="password-form">
            <div class="password-input-wrapper">
                <svg class="input-icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <input
                    type="password"
                    name="password"
                    id="password-input"
                    class="password-field"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                    autofocus
                />
                <div class="input-divider"></div>
                <button type="button" class="eye-toggle-btn" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility">
                    <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>

            <!-- Unlock Button -->
            <button type="submit" id="unlock-submit-btn" class="unlock-btn">
                <span>Unlock</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </form>

        <div class="help-container">
            <a href="#" class="help-link" id="help-link">Need help?</a>
        </div>

        <!-- Security Badges Footer -->
        <footer class="badges-footer">
            <div class="badge-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    <polyline points="9 12 11 14 15 10"></polyline>
                </svg>
                <span>Secure Access</span>
            </div>
            <div class="badge-divider"></div>
            <div class="badge-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
                <span>Your password stays private</span>
            </div>
            <div class="badge-divider"></div>
            <div class="badge-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <span>Protected by SecureURLs</span>
            </div>
        </footer>
    </main>

    <script>
        function togglePasswordVisibility() {
            const input = document.getElementById('password-input');
            const eyeIcon = document.getElementById('eye-icon');
            if (!input) return;

            if (input.type === 'password') {
                input.type = 'text';
                eyeIcon.innerHTML = `
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                `;
            } else {
                input.type = 'password';
                eyeIcon.innerHTML = `
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                `;
            }
        }
    </script>
</body>
</html>
