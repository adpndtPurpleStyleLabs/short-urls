<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter PIN to Continue - PIN Protected Link - PreonsURL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border-light: #e2e8f0;
            --border-focus: #0f172a;
            --btn-bg: #0f172a;
            --btn-hover: #1e293b;
            --btn-text: #ffffff;
            --accent-glow: rgba(15, 23, 42, 0.08);
            --error-bg: #fef2f2;
            --error-border: #fecaca;
            --error-text: #b91c1c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            position: relative;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 15%, rgba(226, 232, 240, 0.5) 0%, transparent 40%),
                radial-gradient(circle at 90% 85%, rgba(226, 232, 240, 0.5) 0%, transparent 40%);
        }

        /* Ambient Background Accents & Doodles */
        .ambient-bg {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .doodle-left {
            position: absolute;
            top: 50%;
            left: calc(50% - 370px);
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            opacity: 0.85;
        }

        .doodle-left .doodle-card {
            width: 72px;
            height: 90px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.06);
            border: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px;
        }

        .doodle-left .mini-lock {
            width: 24px;
            height: 24px;
            background: #f1f5f9;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
        }

        .doodle-left .mini-lines {
            width: 80%;
            height: 4px;
            background: #e2e8f0;
            border-radius: 2px;
        }

        .doodle-text {
            font-size: 13px;
            font-weight: 500;
            color: #64748b;
            font-style: italic;
            text-align: center;
            line-height: 1.2;
        }

        .doodle-right {
            position: absolute;
            top: 25%;
            right: calc(50% - 340px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            opacity: 0.85;
        }

        .organic-leaf-left {
            position: absolute;
            bottom: -50px;
            left: calc(50% - 440px);
            width: 140px;
            height: 180px;
            opacity: 0.25;
            pointer-events: none;
        }

        .organic-leaf-right {
            position: absolute;
            bottom: -30px;
            right: calc(50% - 430px);
            width: 150px;
            height: 190px;
            opacity: 0.25;
            pointer-events: none;
        }

        @media (max-width: 820px) {
            .doodle-left, .doodle-right, .organic-leaf-left, .organic-leaf-right {
                display: none;
            }
        }

        /* Card Container */
        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 44px 40px 32px;
            box-shadow: 0 20px 45px -15px rgba(0, 0, 0, 0.07), 0 0 1px 1px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.05);
            text-align: center;
            animation: cardAppear 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Lock Icon Halo */
        .icon-aura-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 92px;
            height: 92px;
            border-radius: 50%;
            background: radial-gradient(circle, #eff6ff 0%, #f1f5f9 65%, transparent 72%);
            margin-bottom: 24px;
            position: relative;
        }

        .lock-badge {
            width: 54px;
            height: 54px;
            border-radius: 14px;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            box-shadow: 0 10px 20px -4px rgba(15, 23, 42, 0.25);
            position: relative;
        }

        .lock-badge svg {
            width: 26px;
            height: 26px;
        }

        .sparkle-dot {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #94a3b8;
            opacity: 0.6;
        }
        .sparkle-1 { top: 12px; right: 10px; width: 5px; height: 5px; }
        .sparkle-2 { bottom: 14px; left: 8px; width: 7px; height: 7px; }

        /* Typography */
        h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.025em;
            margin-bottom: 8px;
        }

        p.subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.5;
            max-width: 380px;
            margin: 0 auto 28px;
        }

        /* Error Alert */
        .alert {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 16px;
            border-radius: 12px;
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            color: var(--error-text);
            font-size: 13.5px;
            font-weight: 500;
            margin-bottom: 24px;
            text-align: left;
        }

        .alert svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .error-shake {
            animation: shake 0.4s ease-in-out;
        }

        /* PIN Digit Inputs */
        .pin-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 24px;
        }

        .pin-box {
            width: 52px;
            height: 60px;
            border: 1.5px solid var(--border-light);
            border-radius: 12px;
            font-size: 24px;
            font-weight: 600;
            text-align: center;
            color: var(--text-primary);
            background: #ffffff;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            -webkit-appearance: none;
            -moz-appearance: textfield;
            font-family: inherit;
        }

        .pin-box::-webkit-outer-spin-button,
        .pin-box::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .pin-box:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--accent-glow);
            background: #ffffff;
        }

        @media (max-width: 440px) {
            .card {
                padding: 36px 20px 28px;
            }
            .pin-container {
                gap: 6px;
            }
            .pin-box {
                width: 42px;
                height: 52px;
                font-size: 20px;
            }
        }

        /* Submit Button */
        .unlock-btn {
            width: 100%;
            height: 50px;
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
        }

        .unlock-btn:hover {
            background: var(--btn-hover);
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.2);
        }

        .unlock-btn:active {
            transform: translateY(0);
        }

        .unlock-btn svg {
            width: 16px;
            height: 16px;
            transition: transform 0.2s ease;
        }

        .unlock-btn:hover svg {
            transform: translateX(3px);
        }

        /* Help link */
        .help-container {
            margin: 18px 0 26px;
        }

        .help-link {
            font-size: 13.5px;
            color: var(--text-secondary);
            text-decoration: underline;
            text-underline-offset: 3px;
            transition: color 0.15s ease;
        }

        .help-link:hover {
            color: var(--text-primary);
        }

        /* Divider & Badges Footer */
        .badges-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding-top: 18px;
            border-top: 1px solid var(--border-light);
        }

        .badge-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12.5px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .badge-item svg {
            width: 15px;
            height: 15px;
            color: var(--text-muted);
        }

        .badge-divider {
            width: 1px;
            height: 16px;
            background: var(--border-light);
        }

        @media (max-width: 440px) {
            .badges-footer {
                flex-direction: column;
                gap: 8px;
            }
            .badge-divider {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Background Accents & Doodles -->
    <div class="ambient-bg" aria-hidden="true">
        <div class="doodle-left">
            <div class="doodle-card">
                <div class="mini-lock">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </div>
                <div class="mini-lines"></div>
                <div class="mini-lines" style="width: 60%;"></div>
            </div>
            <span class="doodle-text">Your<br>Privacy<br>Matters</span>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.5">
                <path d="M6 18c4-4 8-1 12-7m0 0l-4-1m4 1l-1 4"></path>
            </svg>
        </div>

        <div class="doodle-right">
            <span class="doodle-text">Private<br>Content<br>Inside</span>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.5">
                <path d="M18 6c-4 4-8 1-12 7m0 0l4 1m-4-1l1-4"></path>
            </svg>
        </div>

        <!-- Organic silhouettes -->
        <svg class="organic-leaf-left" viewBox="0 0 100 100" fill="#94a3b8">
            <path d="M20,90 Q10,30 80,10 Q90,70 20,90 Z"></path>
        </svg>
        <svg class="organic-leaf-right" viewBox="0 0 100 100" fill="#94a3b8">
            <path d="M80,90 Q90,30 20,10 Q10,70 80,90 Z"></path>
        </svg>
    </div>

    <!-- Main Card -->
    <main class="card" id="pin-challenge-card">
        <!-- Lock Aura -->
        <div class="icon-aura-wrapper">
            <div class="sparkle-dot sparkle-1"></div>
            <div class="sparkle-dot sparkle-2"></div>
            <div class="lock-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>
        </div>

        <h1 id="pin-title">Enter PIN to Continue</h1>
        <p class="subtitle" id="pin-subtitle">This link is protected. Please enter the PIN to access the content.</p>

        <!-- Error Alert -->
        <div th:if="${errorMessage != null and !errorMessage.isEmpty()}" class="alert error-shake" id="error-alert">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span th:text="${errorMessage}">Invalid PIN entered. Please try again.</span>
        </div>

        <!-- PIN Form -->
        <form method="POST" th:action="${'/' + targetPath + '/verify'}" id="pin-form">
            <!-- Hidden input that carries the full concatenated PIN value for submission -->
            <input type="hidden" name="pin" id="pin-input" required />

            <!-- 6 PIN Digit Input Boxes -->
            <div class="pin-container" role="group" aria-label="PIN Digits">
                <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-box" id="pin-box-1" autocomplete="off" autofocus aria-label="PIN digit 1" />
                <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-box" id="pin-box-2" autocomplete="off" aria-label="PIN digit 2" />
                <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-box" id="pin-box-3" autocomplete="off" aria-label="PIN digit 3" />
                <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-box" id="pin-box-4" autocomplete="off" aria-label="PIN digit 4" />
                <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-box" id="pin-box-5" autocomplete="off" aria-label="PIN digit 5" />
                <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-box" id="pin-box-6" autocomplete="off" aria-label="PIN digit 6" />
            </div>

            <!-- Unlock Button -->
            <button type="submit" id="unlock-submit-btn" class="unlock-btn">
                <span>Unlock</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </form>

        <div class="help-container">
            <a href="#" class="help-link" id="help-link">Need help?</a>
        </div>

        <!-- Security Badges Footer -->
        <footer class="badges-footer">
            <div class="badge-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    <polyline points="9 12 11 14 15 10"></polyline>
                </svg>
                <span>Secure Access</span>
            </div>
            <div class="badge-divider"></div>
            <div class="badge-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
                <span>Your PIN stays private</span>
            </div>
            <div class="badge-divider"></div>
            <div class="badge-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <span>Protected by PreonsURL</span>
            </div>
        </footer>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const boxes = Array.from(document.querySelectorAll('.pin-box'));
            const hiddenInput = document.getElementById('pin-input');
            const form = document.getElementById('pin-form');

            // Auto-focus first input
            if (boxes[0]) {
                boxes[0].focus();
            }

            function updateHiddenInput() {
                const pin = boxes.map(b => b.value).join('');
                hiddenInput.value = pin;
            }

            boxes.forEach((box, index) => {
                // Input handling
                box.addEventListener('input', (e) => {
                    const val = box.value.replace(/[^0-9]/g, '');
                    box.value = val;

                    if (val && index < boxes.length - 1) {
                        boxes[index + 1].focus();
                    }
                    updateHiddenInput();
                });

                // Key navigation
                box.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace') {
                        if (!box.value && index > 0) {
                            boxes[index - 1].focus();
                            boxes[index - 1].value = '';
                            updateHiddenInput();
                        } else {
                            box.value = '';
                            updateHiddenInput();
                        }
                    } else if (e.key === 'ArrowLeft' && index > 0) {
                        boxes[index - 1].focus();
                    } else if (e.key === 'ArrowRight' && index < boxes.length - 1) {
                        boxes[index + 1].focus();
                    }
                });

                // Paste handling for quick copy-paste of 4-6 digit PIN
                box.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pasteData = (e.clipboardData || window.clipboardData).getData('text');
                    const digits = pasteData.replace(/[^0-9]/g, '').split('');

                    if (digits.length > 0) {
                        let curIndex = index;
                        digits.forEach(d => {
                            if (curIndex < boxes.length) {
                                boxes[curIndex].value = d;
                                curIndex++;
                            }
                        });
                        updateHiddenInput();
                        if (curIndex < boxes.length) {
                            boxes[curIndex].focus();
                        } else {
                            boxes[boxes.length - 1].focus();
                        }
                    }
                });
            });

            // On submit
            form.addEventListener('submit', (e) => {
                updateHiddenInput();
                if (!hiddenInput.value || hiddenInput.value.length < 4) {
                    e.preventDefault();
                    // Shake container and focus first empty box
                    const emptyBox = boxes.find(b => !b.value) || boxes[0];
                    emptyBox.focus();
                    const container = document.querySelector('.pin-container');
                    container.classList.remove('error-shake');
                    void container.offsetWidth; // trigger reflow
                    container.classList.add('error-shake');
                }
            });
        });
    </script>
</body>
</html>
