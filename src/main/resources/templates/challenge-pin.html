<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter PIN to Continue - PIN Protected Link - PreonsURL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #ffffff;
            --surface-card: #ffffff;
            --border-subtle: #e4e4e7;
            --border-medium: #d4d4d8;
            --border-focus: #000000;
            --text-pure: #000000;
            --text-high: #09090b;
            --text-muted: #52525b;
            --text-subtle: #71717a;
            --accent-glow: rgba(0, 0, 0, 0.08);
            --accent-glow-strong: rgba(0, 0, 0, 0.18);
            --error-bg: #fef2f2;
            --error-border: #fca5a5;
            --error-text: #991b1b;
            --success-bg: #f4f4f5;
            --success-border: #18181b;
            --success-text: #09090b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: var(--bg-canvas);
            color: var(--text-pure);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
            position: relative;
            overflow-x: hidden;
            background-image:
                radial-gradient(ellipse 70% 40% at 50% -10%, rgba(0, 0, 0, 0.03) 0%, transparent 70%),
                radial-gradient(ellipse 60% 40% at 50% 110%, rgba(0, 0, 0, 0.02) 0%, transparent 60%);
        }

        /* Ambient Geometric Grid */
        .ambient-grid {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image: linear-gradient(to right, rgba(0, 0, 0, 0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(0, 0, 0, 0.03) 1px, transparent 1px);
            background-size: 56px 56px;
            mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
            z-index: 0;
        }

        /* Luxury White Card Container */
        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            background: var(--surface-card);
            border-radius: 20px;
            padding: 44px 36px 32px;
            box-shadow:
                0 0 0 1px rgba(0, 0, 0, 0.03),
                0 20px 48px -12px rgba(0, 0, 0, 0.08),
                0 1px 3px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--border-medium);
            text-align: center;
            animation: cardAppear 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardAppear {
            0% {
                opacity: 0;
                transform: translateY(16px) scale(0.99);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Lock Icon Halo */
        .icon-aura-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle, #f4f4f5 0%, #fafafa 70%, transparent 72%);
            margin-bottom: 20px;
            position: relative;
        }

        .lock-badge {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            box-shadow: 0 8px 18px -4px rgba(0, 0, 0, 0.2);
        }

        .lock-badge svg {
            width: 24px;
            height: 24px;
        }

        .sparkle-dot {
            display: none;
        }

        /* Typography */
        h1 {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--text-pure);
            letter-spacing: -0.02em;
            margin-bottom: 6px;
        }

        p.subtitle {
            font-size: 13.5px;
            color: var(--text-muted);
            line-height: 1.5;
            max-width: 360px;
            margin: 0 auto 26px;
        }

        /* Error Alert */
        .alert {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 16px;
            border-radius: 10px;
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            color: var(--error-text);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 22px;
            text-align: left;
        }

        .alert svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .error-shake {
            animation: shake 0.4s ease-in-out;
        }

        /* PIN Digit Inputs */
        .pin-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 24px;
        }

        .pin-box {
            width: 50px;
            height: 56px;
            border: 1px solid var(--border-medium);
            border-radius: 10px;
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            color: var(--text-pure);
            background: #ffffff;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            -webkit-appearance: none;
            -moz-appearance: textfield;
            font-family: inherit;
        }

        .pin-box::-webkit-outer-spin-button,
        .pin-box::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .pin-box:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 1px #000000, 0 0 16px var(--accent-glow);
            background: #ffffff;
        }

        @media (max-width: 440px) {
            .card {
                padding: 36px 20px 24px;
            }
            .pin-container {
                gap: 6px;
            }
            .pin-box {
                width: 40px;
                height: 50px;
                font-size: 19px;
            }
        }

        /* Submit Button */
        .unlock-btn {
            width: 100%;
            background: #000000;
            color: #ffffff;
            border: 1px solid #000000;
            border-radius: 10px;
            padding: 15px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
        }

        .unlock-btn:hover {
            background: #18181b;
            transform: translateY(-1px);
            box-shadow: 0 8px 24px var(--accent-glow-strong);
        }

        .unlock-btn:active {
            transform: translateY(0);
        }

        .unlock-btn svg {
            width: 15px;
            height: 15px;
            transition: transform 0.2s ease;
        }

        .unlock-btn:hover svg {
            transform: translateX(3px);
        }

        /* Help link */
        .help-container {
            margin: 18px 0 24px;
        }

        .help-link {
            font-size: 13px;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .help-link:hover {
            color: var(--text-pure);
            text-decoration: underline;
        }

        /* Divider & Badges Footer */
        .badges-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding-top: 18px;
            border-top: 1px solid var(--border-subtle);
        }

        .badge-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-subtle);
            font-weight: 500;
        }

        .badge-item svg {
            width: 14px;
            height: 14px;
            color: var(--text-subtle);
        }

        .badge-divider {
            width: 1px;
            height: 14px;
            background: var(--border-subtle);
        }

        @media (max-width: 440px) {
            .badges-footer {
                flex-direction: column;
                gap: 8px;
            }
            .badge-divider {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Ambient Geometric Grid -->
    <div class="ambient-grid" aria-hidden="true"></div>

    <!-- Main Card -->
    <main class="card" id="pin-challenge-card">
        <!-- Lock Aura -->
        <div class="icon-aura-wrapper">
            <div class="sparkle-dot sparkle-1"></div>
            <div class="sparkle-dot sparkle-2"></div>
            <div class="lock-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>
        </div>

        <h1 id="pin-title">Enter PIN to Continue</h1>
        <p class="subtitle" id="pin-subtitle">This link is protected. Please enter the PIN to access the content.</p>

        <!-- Error Alert -->
        <div th:if="${errorMessage != null and !errorMessage.isEmpty()}" class="alert error-shake" id="error-alert">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span th:text="${errorMessage}">Invalid PIN entered. Please try again.</span>
        </div>

        <!-- PIN Form -->
        <form method="POST" th:action="${'/' + targetPath + '/verify'}" id="pin-form">
            <!-- Hidden input that carries the full concatenated PIN value for submission -->
            <input type="hidden" name="pin" id="pin-input" required />

            <!-- 6 PIN Digit Input Boxes -->
            <div class="pin-container" role="group" aria-label="PIN Digits">
                <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-box" id="pin-box-1" autocomplete="off" autofocus aria-label="PIN digit 1" />
                <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-box" id="pin-box-2" autocomplete="off" aria-label="PIN digit 2" />
                <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-box" id="pin-box-3" autocomplete="off" aria-label="PIN digit 3" />
                <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-box" id="pin-box-4" autocomplete="off" aria-label="PIN digit 4" />
                <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-box" id="pin-box-5" autocomplete="off" aria-label="PIN digit 5" />
                <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-box" id="pin-box-6" autocomplete="off" aria-label="PIN digit 6" />
            </div>

            <!-- Unlock Button -->
            <button type="submit" id="unlock-submit-btn" class="unlock-btn">
                <span>Unlock</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </form>

        <div class="help-container">
            <a href="#" class="help-link" id="help-link">Need help?</a>
        </div>

        <!-- Security Badges Footer -->
        <footer class="badges-footer">
            <div class="badge-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    <polyline points="9 12 11 14 15 10"></polyline>
                </svg>
                <span>Secure Access</span>
            </div>
            <div class="badge-divider"></div>
            <div class="badge-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
                <span>Your PIN stays private</span>
            </div>
            <div class="badge-divider"></div>
            <div class="badge-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <span>Protected by PreonsURL</span>
            </div>
        </footer>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const boxes = Array.from(document.querySelectorAll('.pin-box'));
            const hiddenInput = document.getElementById('pin-input');
            const form = document.getElementById('pin-form');

            // Auto-focus first input
            if (boxes[0]) {
                boxes[0].focus();
            }

            function updateHiddenInput() {
                const pin = boxes.map(b => b.value).join('');
                hiddenInput.value = pin;
            }

            boxes.forEach((box, index) => {
                // Input handling
                box.addEventListener('input', (e) => {
                    const val = box.value.replace(/[^0-9]/g, '');
                    box.value = val;

                    if (val && index < boxes.length - 1) {
                        boxes[index + 1].focus();
                    }
                    updateHiddenInput();
                });

                // Key navigation
                box.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace') {
                        if (!box.value && index > 0) {
                            boxes[index - 1].focus();
                            boxes[index - 1].value = '';
                            updateHiddenInput();
                        } else {
                            box.value = '';
                            updateHiddenInput();
                        }
                    } else if (e.key === 'ArrowLeft' && index > 0) {
                        boxes[index - 1].focus();
                    } else if (e.key === 'ArrowRight' && index < boxes.length - 1) {
                        boxes[index + 1].focus();
                    }
                });

                // Paste handling for quick copy-paste of 4-6 digit PIN
                box.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pasteData = (e.clipboardData || window.clipboardData).getData('text');
                    const digits = pasteData.replace(/[^0-9]/g, '').split('');

                    if (digits.length > 0) {
                        let curIndex = index;
                        digits.forEach(d => {
                            if (curIndex < boxes.length) {
                                boxes[curIndex].value = d;
                                curIndex++;
                            }
                        });
                        updateHiddenInput();
                        if (curIndex < boxes.length) {
                            boxes[curIndex].focus();
                        } else {
                            boxes[boxes.length - 1].focus();
                        }
                    }
                });
            });

            // On submit
            form.addEventListener('submit', (e) => {
                updateHiddenInput();
                if (!hiddenInput.value || hiddenInput.value.length < 4) {
                    e.preventDefault();
                    // Shake container and focus first empty box
                    const emptyBox = boxes.find(b => !b.value) || boxes[0];
                    emptyBox.focus();
                    const container = document.querySelector('.pin-container');
                    container.classList.remove('error-shake');
                    void container.offsetWidth; // trigger reflow
                    container.classList.add('error-shake');
                }
            });
        });
    </script>
</body>
</html>
