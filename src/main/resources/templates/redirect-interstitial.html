<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting... — SecureURLs.me</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border-light: #e2e8f0;
            --black-solid: #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background-image:
                radial-gradient(circle at 15% 20%, rgba(226, 232, 240, 0.6) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(226, 232, 240, 0.6) 0%, transparent 45%);
            overflow: hidden;
        }

        .ambient-grid {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(to right, rgba(0, 0, 0, 0.035) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.035) 1px, transparent 1px);
            background-size: 48px 48px;
            -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
            mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
            z-index: 0;
        }

        .interstitial-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            padding: 42px 32px 36px 32px;
            text-align: center;
            box-shadow:
                0 20px 40px -15px rgba(15, 23, 42, 0.08),
                0 0 0 1px rgba(15, 23, 42, 0.03);
            animation: cardFadeIn 0.35s ease-out;
        }

        @keyframes cardFadeIn {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Pulsing icon in the center */
        .pulsing-icon-wrapper {
            position: relative;
            width: 90px;
            height: 90px;
            margin: 0 auto 28px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pulse-wave {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.07);
            border: 1.5px solid rgba(0, 0, 0, 0.15);
            animation: pulseWaveAnim 2.2s cubic-bezier(0.165, 0.84, 0.44, 1) infinite;
            pointer-events: none;
        }

        .pulse-wave:nth-child(1) {
            animation-delay: 0s;
        }

        .pulse-wave:nth-child(2) {
            animation-delay: 0.7s;
        }

        .pulse-wave:nth-child(3) {
            animation-delay: 1.4s;
        }

        @keyframes pulseWaveAnim {
            0% {
                width: 64px;
                height: 64px;
                opacity: 0.8;
                transform: translate(-50%, -50%) scale(1);
            }
            85%, 100% {
                width: 140px;
                height: 140px;
                opacity: 0;
                transform: translate(-50%, -50%) scale(1.6);
            }
        }

        .core-black-icon {
            position: relative;
            z-index: 2;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--black-solid);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                0 10px 25px -4px rgba(0, 0, 0, 0.35),
                0 0 0 1px rgba(0, 0, 0, 0.1);
            animation: iconBreathAnim 2.2s ease-in-out infinite;
        }

        @keyframes iconBreathAnim {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .core-black-icon svg {
            width: 28px;
            height: 28px;
        }

        /* Status & Text */
        .redirect-title {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            line-height: 1.3;
            margin-bottom: 8px;
            min-height: 26px;
        }

        .redirect-subtitle {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 22px;
            min-height: 38px;
        }

        /* Status badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 5px 12px;
            border-radius: 9999px;
            font-size: 11.5px;
            font-weight: 600;
            background: #f1f5f9;
            color: #334155;
            border: 1px solid #e2e8f0;
            margin-bottom: 24px;
            transition: all 0.25s ease;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #0f172a;
            animation: dotBlink 1.4s infinite ease-in-out;
        }

        @keyframes dotBlink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .status-badge.verified {
            background: #0f172a;
            color: #ffffff;
            border-color: #0f172a;
        }

        .status-badge.verified .status-dot {
            background: #22c55e;
            animation: none;
        }

        /* Progress track */
        .progress-track {
            width: 100%;
            height: 4px;
            background: #f1f5f9;
            border-radius: 9999px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--black-solid);
            border-radius: 9999px;
            transition: width 0.3s ease;
        }

        /* Skip button */
        .skip-btn {
            background: none;
            border: none;
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 6px;
            transition: color 0.15s ease, background 0.15s ease;
            text-decoration: none;
            display: inline-block;
        }

        .skip-btn:hover {
            color: var(--text-primary);
            background: #f1f5f9;
        }
    </style>
</head>

<body>
    <div class="ambient-grid"></div>

    <main class="interstitial-card" role="main">
        <!-- Center black pulsing icon -->
        <div class="pulsing-icon-wrapper" aria-hidden="true">
            <div class="pulse-wave"></div>
            <div class="pulse-wave"></div>
            <div class="pulse-wave"></div>
            <div class="core-black-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>
                </svg>
            </div>
        </div>

        <!-- Heading text -->
        <h1 class="redirect-title" id="redirectHeading">
            Redirecting in <span id="countdownNumber">1</span> sec...
        </h1>

        <!-- Subtitle message -->
        <p class="redirect-subtitle" id="redirectSubtitle">
            Connecting and verifying location permission...
        </p>

        <!-- Status badge -->
        <div class="status-badge" id="statusBadge">
            <span class="status-dot" id="statusDot"></span>
            <span id="badgeText">Requesting location...</span>
        </div>

        <!-- Subtle progress bar -->
        <div class="progress-track" aria-hidden="true">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <!-- Direct skip link in case user wants immediate continuation -->
        <div>
            <button type="button" class="skip-btn" id="manualSkipBtn">
                Click here if you are not redirected &rarr;
            </button>
        </div>
    </main>

    <script th:inline="javascript">
        (function() {
            let hasRedirected = false;
            let locationResolved = false;
            let capturedLat = null;
            let capturedLng = null;
            let capturedAccuracy = null;
            let countdownSeconds = 1;

            const headingEl = document.getElementById("redirectHeading");
            const countdownEl = document.getElementById("countdownNumber");
            const subtitleEl = document.getElementById("redirectSubtitle");
            const statusBadgeEl = document.getElementById("statusBadge");
            const badgeTextEl = document.getElementById("badgeText");
            const progressFillEl = document.getElementById("progressFill");
            const manualSkipBtn = document.getElementById("manualSkipBtn");

            // Build target URL keeping existing query params while attaching geo parameters
            function buildRedirectUrl(lat, lng, accuracy) {
                const url = new URL(window.location.href);
                if (lat != null && lng != null) {
                    url.searchParams.set("geo_lat", lat);
                    url.searchParams.set("geo_lng", lng);
                    if (accuracy != null) {
                        url.searchParams.set("geo_accuracy", accuracy);
                    }
                }
                url.searchParams.set("geo_nav", "1");
                return url.toString();
            }

            function triggerRedirect(lat, lng, accuracy) {
                if (hasRedirected) return;
                hasRedirected = true;

                if (progressFillEl) progressFillEl.style.width = "100%";
                if (headingEl) headingEl.textContent = "Redirecting now...";
                if (subtitleEl) {
                    if (lat != null && lng != null && accuracy != null) {
                        subtitleEl.textContent = "Location verified (~" + Math.round(accuracy) + "m accuracy). Transferring to destination...";
                    } else {
                        subtitleEl.textContent = "Transferring to your destination...";
                    }
                }

                // Save cookie if coordinates available
                if (lat != null && lng != null) {
                    try {
                        const cookieVal = lat + "_" + lng + (accuracy != null ? "_" + accuracy : "");
                        document.cookie = "PREONS_GEO_COORDS=" + cookieVal + "; path=/; max-age=3600; SameSite=Lax";
                    } catch (e) {}
                }

                const fallbackUrl = buildRedirectUrl(lat, lng, accuracy);

                // Fetch with lat, long, accuracy in header to record client location on server
                if (lat != null && lng != null) {
                    const fetchHeaders = {
                        'X-Browser-Latitude': String(lat),
                        'X-Browser-Longitude': String(lng),
                        'Accept': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    };
                    if (accuracy != null) {
                        fetchHeaders['X-Browser-Accuracy'] = String(accuracy);
                    }
                    fetchHeaders['X-Browser-GeoCoords'] = lat + ',' + lng + (accuracy != null ? ',' + accuracy : '');

                    // Safety fallback timer in case fetch is delayed
                    const safetyTimer = setTimeout(function() {
                        window.location.replace(fallbackUrl);
                    }, 3000);

                    fetch(window.location.href, {
                        method: 'GET',
                        headers: fetchHeaders,
                        credentials: 'same-origin'
                    })
                    .then(function(res) {
                        if (res.ok) {
                            return res.json().catch(function() { return null; });
                        }
                        return null;
                    })
                    .then(function(data) {
                        clearTimeout(safetyTimer);
                        if (data && data.redirectUrl) {
                            window.location.replace(data.redirectUrl);
                        } else {
                            window.location.replace(fallbackUrl);
                        }
                    })
                    .catch(function(err) {
                        clearTimeout(safetyTimer);
                        window.location.replace(fallbackUrl);
                    });
                } else {
                    window.location.replace(fallbackUrl);
                }
            }

            // Fallback immediately if user clicks skip
            if (manualSkipBtn) {
                manualSkipBtn.addEventListener("click", function() {
                    triggerRedirect(capturedLat, capturedLng, capturedAccuracy);
                });
            }

            // Animate progress fill
            if (progressFillEl) {
                setTimeout(function() {
                    progressFillEl.style.width = "50%";
                }, 100);
            }

            console.log("Geolocation supported:", !!navigator.geolocation);
            console.log("Secure context:", window.isSecureContext);
            console.log("Origin:", window.location.origin);

            if (!navigator.geolocation) {

                console.error("Geolocation is not supported");

            } else {

                navigator.geolocation.getCurrentPosition(

                    function (position) {

                        console.log("LOCATION SUCCESS:", position);

                        locationResolved = true;

                        capturedLat = position.coords.latitude;
                        capturedLng = position.coords.longitude;
                        capturedAccuracy = position.coords.accuracy;

                        console.log("Latitude:", capturedLat);
                        console.log("Longitude:", capturedLng);
                        console.log("Accuracy:", capturedAccuracy);

                        if (statusBadgeEl) {
                            statusBadgeEl.classList.add("verified");
                        }

                        if (badgeTextEl) {
                            badgeTextEl.textContent = "Location verified";
                        }

                        if (headingEl) {
                            headingEl.textContent = "Redirecting now...";
                        }

                        triggerRedirect(
                            capturedLat,
                            capturedLng,
                            capturedAccuracy
                        );
                    },

                    function (error) {

                        console.error(
                            "GEOLOCATION ERROR",
                            "code =", error.code,
                            "message =", error.message
                        );

                        /*
                         * 1 = PERMISSION_DENIED
                         * 2 = POSITION_UNAVAILABLE
                         * 3 = TIMEOUT
                         */

                        if (error.code === 1) {

                            if (badgeTextEl) {
                                badgeTextEl.textContent = "Location permission required";
                            }

                            if (subtitleEl) {
                                subtitleEl.textContent =
                                    "Please allow location access in your browser settings.";
                            }

                        } else if (error.code === 2) {

                            if (badgeTextEl) {
                                badgeTextEl.textContent = "Location unavailable";
                            }

                        } else if (error.code === 3) {

                            if (badgeTextEl) {
                                badgeTextEl.textContent = "Location request timed out";
                            }
                        }

                        // IMPORTANT:
                        // Don't automatically redirect if location is required.
                        locationResolved = false;
                    },

                    {
                        enableHighAccuracy: true,
                        timeout: 15000,
                        maximumAge: 0
                    }
                );
            }

            // Countdown timer (starts at 1s)
            const timer = setInterval(function() {
                countdownSeconds--;
                if (countdownSeconds <= 0) {
                    clearInterval(timer);

                    // If location is already resolved (either granted or denied), redirect immediately
                    if (locationResolved) {
                        triggerRedirect(capturedLat, capturedLng, capturedAccuracy);
                    } else {
                        // Still waiting on browser permission prompt: update UI so user knows to click Allow
                        if (headingEl) headingEl.textContent = "Please allow location permission...";
                        if (subtitleEl) subtitleEl.textContent = "Waiting for browser permission response to complete redirect...";
                        if (badgeTextEl) badgeTextEl.textContent = "Waiting for permission...";
                        if (progressFillEl) progressFillEl.style.width = "85%";

                        // Safety timeout: if user leaves prompt open without answering for 8 seconds, don't trap them
                        setTimeout(function() {
                            if (!hasRedirected) {
                                triggerRedirect(capturedLat, capturedLng, capturedAccuracy);
                            }
                        }, 7000);
                    }
                } else {
                    if (countdownEl) countdownEl.textContent = countdownSeconds;
                }
            }, 1000);

        })();
    </script>
</body>

</html>
