<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PreonsURL — Create Membership</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #ffffff;
            --surface-card: #ffffff;
            --border-subtle: #e4e4e7;
            --border-medium: #d4d4d8;
            --border-focus: #000000;
            --text-pure: #000000;
            --text-high: #09090b;
            --text-muted: #52525b;
            --text-subtle: #71717a;
            --accent-glow: rgba(0, 0, 0, 0.08);
            --accent-glow-strong: rgba(0, 0, 0, 0.18);
            --error-bg: #fef2f2;
            --error-border: #fca5a5;
            --error-text: #991b1b;
            --success-bg: #f4f4f5;
            --success-border: #18181b;
            --success-text: #09090b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-canvas);
            color: var(--text-pure);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
            position: relative;
            overflow-x: hidden;
            background-image:
                radial-gradient(ellipse 70% 40% at 50% -10%, rgba(0, 0, 0, 0.03) 0%, transparent 70%),
                radial-gradient(ellipse 60% 40% at 50% 110%, rgba(0, 0, 0, 0.02) 0%, transparent 60%);
        }

        /* Ambient Geometric Grid */
        .ambient-grid {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image: linear-gradient(to right, rgba(0, 0, 0, 0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(0, 0, 0, 0.03) 1px, transparent 1px);
            background-size: 56px 56px;
            mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
            z-index: 0;
        }

        /* Luxury White Card Container */
        .luxury-card {
            width: 100%;
            max-width: 460px;
            background: var(--surface-card);
            border: 1px solid var(--border-medium);
            border-radius: 20px;
            padding: 48px 40px;
            position: relative;
            z-index: 1;
            box-shadow:
                0 0 0 1px rgba(0, 0, 0, 0.03),
                0 20px 48px -12px rgba(0, 0, 0, 0.08),
                0 1px 3px rgba(0, 0, 0, 0.04);
            animation: cardAppear 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardAppear {
            0% {
                opacity: 0;
                transform: translateY(16px) scale(0.99);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Auth Header */
        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-title {
            font-family: 'Cinzel', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-pure);
        }

        /* Banner Alerts */
        .alert-banner {
            display: none;
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 24px;
            animation: fadeIn 0.3s ease-out forwards;
        }

        .alert-banner.error {
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            color: var(--error-text);
        }

        .alert-banner.success {
            background: var(--success-bg);
            border: 1px solid var(--success-border);
            color: var(--success-text);
            font-weight: 500;
        }

        .alert-banner.visible {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Form Layout */
        .form-group {
            margin-bottom: 22px;
            position: relative;
        }

        .form-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-pure);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-input {
            width: 100%;
            background: #ffffff;
            border: 1px solid var(--border-medium);
            border-radius: 10px;
            padding: 14px 16px;
            font-size: 14px;
            font-family: inherit;
            color: var(--text-pure);
            outline: none;
            transition: all 0.2s ease;
        }

        .form-input::placeholder {
            color: #a1a1aa;
            font-weight: 400;
        }

        .form-input:focus {
            background: #ffffff;
            border-color: var(--border-focus);
            box-shadow: 0 0 0 1px #000000, 0 0 16px var(--accent-glow);
        }

        .input-icon-btn {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .input-icon-btn:hover {
            color: var(--text-pure);
        }

        /* Field Hints & Requirement Indicator */
        .field-hint {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 6px;
            letter-spacing: 0.02em;
        }

        /* Password Strength Meter */
        .strength-meter {
            display: flex;
            gap: 4px;
            margin-top: 8px;
            height: 2px;
        }

        .strength-bar {
            flex: 1;
            background: #e4e4e7;
            border-radius: 1px;
            transition: background 0.3s ease;
        }

        .strength-bar.active {
            background: #000000;
        }

        /* Action Buttons */
        .submit-btn {
            width: 100%;
            background: #000000;
            color: #ffffff;
            border: 1px solid #000000;
            border-radius: 10px;
            padding: 15px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 28px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
        }

        .submit-btn:hover {
            background: #18181b;
            transform: translateY(-1px);
            box-shadow: 0 8px 24px var(--accent-glow-strong);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Spinner */
        .spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Card Footer */
        .card-footer {
            margin-top: 32px;
            text-align: center;
            border-top: 1px solid var(--border-subtle);
            padding-top: 24px;
        }

        .footer-text {
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 0.04em;
        }

        .footer-link {
            color: var(--text-pure);
            font-weight: 700;
            text-decoration: none;
            margin-left: 6px;
            letter-spacing: 0.06em;
            border-bottom: 1.5px solid #000000;
            padding-bottom: 2px;
            transition: all 0.2s ease;
        }

        .footer-link:hover {
            color: #27272a;
            border-bottom-color: #52525b;
        }
    </style>
</head>
<body>
    <div class="ambient-grid"></div>

    <main class="luxury-card">
        <!-- Auth Header -->
        <header class="auth-header">
            <h1 class="auth-title">Register Now</h1>
        </header>

        <!-- Status Alerts -->
        <div id="alertBanner" class="alert-banner" role="alert">
            <span id="alertIcon">&#9679;</span>
            <span id="alertMessage"></span>
        </div>

        <!-- Server-side error banner if redirected/rendered without JS -->
        <div th:if="${error}" class="alert-banner error visible" role="alert">
            <span>&#9679;</span>
            <span th:text="${error}"></span>
        </div>

        <!-- Registration Form -->
        <form id="registerForm" method="POST" action="/register" novalidate>
            <div class="form-group">
                <label for="fullName" class="form-label">Full Name</label>
                <div class="input-wrapper">
                    <input type="text"
                           id="fullName"
                           name="fullName"
                           class="form-input"
                           placeholder="Alexander Hamilton"
                           th:value="${fullName}"
                           required
                           maxlength="100"
                           autocomplete="name">
                </div>
            </div>

            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <div class="input-wrapper">
                    <input type="text"
                           id="username"
                           name="username"
                           class="form-input"
                           placeholder="3–20 characters"
                           th:value="${username}"
                           required
                           minlength="3"
                           maxlength="20"
                           autocomplete="username"
                           spellcheck="false">
                </div>
                <small class="field-hint">Must be 3–20 alphanumeric characters</small>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Master Key / Password</label>
                <div class="input-wrapper">
                    <input type="password"
                           id="password"
                           name="password"
                           class="form-input"
                           placeholder="8–20 characters"
                           required
                           minlength="8"
                           maxlength="20"
                           autocomplete="new-password">
                    <button type="button" id="togglePasswordBtn" class="input-icon-btn" aria-label="Toggle password visibility">
                        <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
                <div class="strength-meter">
                    <div class="strength-bar" id="bar1"></div>
                    <div class="strength-bar" id="bar2"></div>
                    <div class="strength-bar" id="bar3"></div>
                </div>
                <small class="field-hint">Must be between 8 and 20 characters</small>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">
                <span class="spinner" id="btnSpinner"></span>
                <span id="btnText">Establish Account</span>
                <span id="btnArrow">&rarr;</span>
            </button>
        </form>

        <!-- Footer Navigation -->
        <footer class="card-footer">
            <p class="footer-text">
                Already registered?
                <a href="/login" class="footer-link">Sign In &rarr;</a>
            </p>
        </footer>
    </main>

    <script>
        const form = document.getElementById('registerForm');
        const fullNameInput = document.getElementById('fullName');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submitBtn');
        const btnSpinner = document.getElementById('btnSpinner');
        const btnText = document.getElementById('btnText');
        const btnArrow = document.getElementById('btnArrow');
        const alertBanner = document.getElementById('alertBanner');
        const alertMessage = document.getElementById('alertMessage');
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');

        // Toggle password view
        togglePasswordBtn.addEventListener('click', () => {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        });

        // Password strength meter
        passwordInput.addEventListener('input', () => {
            const val = passwordInput.value;
            const b1 = document.getElementById('bar1');
            const b2 = document.getElementById('bar2');
            const b3 = document.getElementById('bar3');

            b1.classList.toggle('active', val.length >= 8);
            b2.classList.toggle('active', val.length >= 12);
            b3.classList.toggle('active', val.length >= 16 && /[A-Z]/.test(val) && /[0-9]/.test(val));
        });

        function showAlert(message, type = 'error') {
            alertBanner.className = `alert-banner ${type} visible`;
            alertMessage.textContent = message;
        }

        function hideAlert() {
            alertBanner.className = 'alert-banner';
            alertMessage.textContent = '';
        }

        function setLoading(loading) {
            submitBtn.disabled = loading;
            btnSpinner.style.display = loading ? 'inline-block' : 'none';
            btnArrow.style.display = loading ? 'none' : 'inline-block';
            btnText.textContent = loading ? 'Provisioning...' : 'Establish Account';
        }

        // Intercept form submission to invoke AuthController API
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert();

            const fullName = fullNameInput.value.trim();
            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            // Client-side pre-validations matching backend rules
            if (!fullName) {
                showAlert('Full name cannot be empty.');
                fullNameInput.focus();
                return;
            }
            if (fullName.length > 100) {
                showAlert('Full name cannot exceed 100 characters.');
                fullNameInput.focus();
                return;
            }
            if (!username) {
                showAlert('Username cannot be empty.');
                usernameInput.focus();
                return;
            }
            if (username.length < 3 || username.length > 20) {
                showAlert('Username must be between 3 and 20 characters.');
                usernameInput.focus();
                return;
            }
            if (!password) {
                showAlert('Password cannot be empty.');
                passwordInput.focus();
                return;
            }
            if (password.length < 8 || password.length > 20) {
                showAlert('Password must be between 8 and 20 characters.');
                passwordInput.focus();
                return;
            }

            setLoading(true);

            try {
                // Call AuthController endpoint: /api/auth/register
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        fullName: fullName,
                        username: username,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showAlert('Account created successfully. Redirecting to sign in...', 'success');
                    // Smooth redirect to /login
                    setTimeout(() => {
                        window.location.href = '/login?registered=true';
                    }, 800);
                } else {
                    showAlert(data.message || (data.data && data.data.error) || 'Registration failed.');
                    setLoading(false);
                }
            } catch (err) {
                // Fallback to standard form submission if network or fetch issue
                console.warn('Fetch failed, falling back to form POST:', err);
                form.submit();
            }
        });
    </script>
</body>
</html>
