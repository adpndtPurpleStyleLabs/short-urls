<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter PIN &amp; Password to Continue - PreonsURL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border-light: #e2e8f0;
            --border-focus: #0f172a;
            --btn-bg: #0f172a;
            --btn-hover: #1e293b;
            --btn-text: #ffffff;
            --accent-glow: rgba(15, 23, 42, 0.08);
            --error-bg: #fef2f2;
            --error-border: #fecaca;
            --error-text: #b91c1c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            position: relative;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 15%, rgba(226, 232, 240, 0.5) 0%, transparent 40%),
                radial-gradient(circle at 90% 85%, rgba(226, 232, 240, 0.5) 0%, transparent 40%);
        }

        .ambient-bg {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 44px 40px 32px;
            box-shadow: 0 20px 45px -15px rgba(0, 0, 0, 0.07), 0 0 1px 1px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.05);
            text-align: center;
            animation: cardAppear 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-aura-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 92px;
            height: 92px;
            border-radius: 50%;
            background: radial-gradient(circle, #eff6ff 0%, #f1f5f9 65%, transparent 72%);
            margin-bottom: 24px;
            position: relative;
        }

        .lock-badge {
            width: 54px;
            height: 54px;
            border-radius: 14px;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            box-shadow: 0 10px 20px -4px rgba(15, 23, 42, 0.25);
        }

        .lock-badge svg {
            width: 26px;
            height: 26px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.025em;
            margin-bottom: 8px;
        }

        p.subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.5;
            max-width: 380px;
            margin: 0 auto 24px;
        }

        .field-label {
            display: block;
            text-align: left;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .alert {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 16px;
            border-radius: 12px;
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            color: var(--error-text);
            font-size: 13.5px;
            font-weight: 500;
            margin-bottom: 24px;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .error-shake { animation: shake 0.4s ease-in-out; }

        .pin-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .pin-box {
            width: 48px;
            height: 56px;
            border: 1.5px solid var(--border-light);
            border-radius: 12px;
            font-size: 22px;
            font-weight: 600;
            text-align: center;
            color: var(--text-primary);
            background: #ffffff;
            outline: none;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .pin-box:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .password-input-wrapper {
            display: flex;
            align-items: center;
            height: 50px;
            border: 1.5px solid var(--border-light);
            border-radius: 12px;
            padding: 0 16px;
            background: #ffffff;
            margin-bottom: 24px;
            transition: all 0.2s ease;
        }

        .password-input-wrapper:focus-within {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .input-icon-left {
            width: 18px;
            height: 18px;
            color: var(--text-muted);
            margin-right: 12px;
        }

        .password-field {
            flex: 1;
            height: 100%;
            border: none;
            outline: none;
            font-family: inherit;
            font-size: 14.5px;
            color: var(--text-primary);
            background: transparent;
        }

        .input-divider {
            width: 1px;
            height: 22px;
            background: var(--border-light);
            margin: 0 8px;
        }

        .eye-toggle-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            display: flex;
            align-items: center;
        }

        .unlock-btn {
            width: 100%;
            height: 50px;
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .unlock-btn:hover {
            background: var(--btn-hover);
            transform: translateY(-1px);
        }

        .help-container {
            margin: 18px 0 24px;
        }

        .help-link {
            font-size: 13.5px;
            color: var(--text-secondary);
            text-decoration: underline;
        }

        .badges-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding-top: 18px;
            border-top: 1px solid var(--border-light);
        }

        .badge-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12.5px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .badge-divider {
            width: 1px;
            height: 16px;
            background: var(--border-light);
        }

        @media (max-width: 440px) {
            .card { padding: 32px 18px; }
            .pin-box { width: 40px; height: 48px; }
            .badges-footer { flex-direction: column; gap: 8px; }
            .badge-divider { display: none; }
        }
    </style>
</head>
<body>
    <main class="card" id="combined-challenge-card">
        <div class="icon-aura-wrapper">
            <div class="lock-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>
        </div>

        <h1>Enter Credentials to Continue</h1>
        <p class="subtitle">This link is protected with PIN and Password verification.</p>

        <div th:if="${errorMessage != null and !errorMessage.isEmpty()}" class="alert error-shake" id="error-alert">
            <span th:text="${errorMessage}">Invalid credentials. Please try again.</span>
        </div>

        <form method="POST" th:action="${'/' + targetPath + '/verify'}" id="combined-form">
            <input type="hidden" name="pin" id="pin-hidden-input" required />

            <label class="field-label">Security PIN</label>
            <div class="pin-container">
                <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-box" autocomplete="off" autofocus />
                <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-box" autocomplete="off" />
                <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-box" autocomplete="off" />
                <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-box" autocomplete="off" />
                <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-box" autocomplete="off" />
                <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-box" autocomplete="off" />
            </div>

            <label class="field-label">Password</label>
            <div class="password-input-wrapper">
                <svg class="input-icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <input type="password" name="password" id="password-input" class="password-field" placeholder="Enter password" required />
                <div class="input-divider"></div>
                <button type="button" class="eye-toggle-btn" onclick="togglePasswordVisibility()" aria-label="Toggle password">
                    <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>

            <button type="submit" id="unlock-submit-btn" class="unlock-btn">
                <span>Unlock</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </form>

        <div class="help-container">
            <a href="#" class="help-link">Need help?</a>
        </div>

        <footer class="badges-footer">
            <div class="badge-item">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    <polyline points="9 12 11 14 15 10"></polyline>
                </svg>
                <span>Secure Access</span>
            </div>
            <div class="badge-divider"></div>
            <div class="badge-item">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <span>Protected by PreonsURL</span>
            </div>
        </footer>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const boxes = Array.from(document.querySelectorAll('.pin-box'));
            const hiddenInput = document.getElementById('pin-hidden-input');
            const form = document.getElementById('combined-form');

            function updateHiddenInput() {
                hiddenInput.value = boxes.map(b => b.value).join('');
            }

            boxes.forEach((box, idx) => {
                box.addEventListener('input', () => {
                    box.value = box.value.replace(/[^0-9]/g, '');
                    if (box.value && idx < boxes.length - 1) boxes[idx + 1].focus();
                    updateHiddenInput();
                });
                box.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace') {
                        if (!box.value && idx > 0) {
                            boxes[idx - 1].focus();
                            boxes[idx - 1].value = '';
                        } else {
                            box.value = '';
                        }
                        updateHiddenInput();
                    }
                });
            });

            form.addEventListener('submit', () => updateHiddenInput());
        });

        function togglePasswordVisibility() {
            const input = document.getElementById('password-input');
            if (!input) return;
            input.type = input.type === 'password' ? 'text' : 'password';
        }
    </script>
</body>
</html>
