spring.application.name=secureurls
server.port=${SERVER_PORT:4984}

# MySQL Datasource for Docker Container Environment
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:preonsurl}?allowPublicKeyRetrieval=true&useSSL=false&cacheServerConfiguration=true&useLocalSessionState=true&elideSetAutoCommits=true&maintainTimeStats=false
spring.datasource.username=${DB_USER:preons}
spring.datasource.password=${DB_PASSWORD:preonspass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Memory Optimization
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=10000
spring.main.lazy-initialization=true
# Tomcat Thread Pool Memory Optimization
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=10
server.tomcat.max-connections=2000
server.tomcat.accept-count=100

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.threads.virtual.enabled=true
springdoc.swagger-ui.path=/xapi/swagger-ui
springdoc.api-docs.path=/xapi/v3/api-docs

#response compression
server.compression.enabled=true
server.compression.min-response-size=1KB
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,text/javascript,application/javascript