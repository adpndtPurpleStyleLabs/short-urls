spring.application.name=preonsurl
server.port=${SERVER_PORT:4982}

# MariaDB Datasource for Docker Container Environment
spring.datasource.url=jdbc:mariadb://${DB_HOST:mariadb}:${DB_PORT:3306}/${DB_NAME:preonsurl}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8mb4
spring.datasource.username=${DB_USER:preons}
spring.datasource.password=${DB_PASSWORD:preonspass}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# HikariCP Connection Pool Memory Optimization
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# Tomcat Thread Pool Memory Optimization
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=10
server.tomcat.max-connections=2000
server.tomcat.accept-count=100

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false


# PreonsURL Shortener Engine Configuration
preonsurl.app.domain=${APP_DOMAIN:app.domain.com}
preonsurl.psecure.domain=${PSECURE_DOMAIN:http://psecure.domain.com:8084}
preonsurl.serve.domain=${SERVE_DOMAIN:go.domain.com}
preonsurl.shortener.domain=${SHORTENER_DOMAIN:http://localhost:8081}
preonsurl.shortener.worker-count=${SHORTENER_WORKER_COUNT:4}
preonsurl.shortener.bucket-capacity=${SHORTENER_BUCKET_CAPACITY:100}
preonsurl.shortener.secret=${SHORTENER_SECRET:PREONS-URL-SECRET-KEY-123456789}

security.jwt.secret=${JWT_SECRET:xx}
security.jwt.expiration-seconds=3600

spring.threads.virtual.enabled=true
springdoc.swagger-ui.path=/xapi/swagger-ui
springdoc.api-docs.path=/xapi/v3/api-docs

# Mailtrap Emailer Configuration (mailtrap-java API)
mailtrap.api-token=${MAILTRAP_API_TOKEN:xx}
mailtrap.sender-email=${MAILTRAP_SENDER_EMAIL:hello@madxglobaltech.com}
mailtrap.sender-name=${MAILTRAP_SENDER_NAME:PruneUrl}

#response compression
server.compression.enabled=true
server.compression.min-response-size=1KB
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,text/javascript,application/javascript