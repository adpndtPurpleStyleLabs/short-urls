spring.application.name=preonsurl-test
server.port=0

# H2 in-memory Database for Test Execution
spring.datasource.url=jdbc:h2:mem:preonsurl_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate for Test Execution
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Test Shortener & API Key Configuration
preonsurl.api.key=test-api-key-12345
preonsurl.shortener.domain=http://localhost:8081
preonsurl.shortener.worker-count=2
preonsurl.shortener.bucket-capacity=20
preonsurl.shortener.secret=TEST-SECRET-KEY-123456789
