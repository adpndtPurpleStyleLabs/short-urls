services:

  # =========================
  # APP SERVICE
  # =========================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        COMMIT_REF: ${COMMIT_REF:-${GIT_COMMIT:-}}

    container_name: preonsurl-app

    ports:
      - "127.0.0.1:4982:8878"

    environment:
      SPRING_PROFILES_ACTIVE: app
      SERVER_PORT: 8878

      COMMIT_REF: ${COMMIT_REF:-${GIT_COMMIT:-}}
      GIT_COMMIT: ${COMMIT_REF:-${GIT_COMMIT:-}}

      LOG_PATH: /app/logs

      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-${MARIADB_DATABASE:-preonsurl}}
      DB_USER: ${MYSQL_USER:-${MARIADB_USER:-preons}}
      DB_PASSWORD: ${MYSQL_PASSWORD:-${MARIADB_PASSWORD:-preonspass}}

      MAILTRAP_API_TOKEN: ${MAILTRAP_API_TOKEN}

      SHORTENER_DOMAIN: https://secure.indexrender.io
      APP_DOMAIN: https://go.indexrender.io
      PSECURE_DOMAIN: https://psecure.indexrender.io

      JWT_SECRET: ${JWT_SECRET}
      SHORTENER_SECRET: ${SHORTENER_SECRET}

      JAVA_OPTS: >-
        -XX:+UseG1GC
        -Xms128m
        -Xmx512m
        -Xss512k
        -XX:MaxMetaspaceSize=160m
        -XX:+ExitOnOutOfMemoryError

    volumes:
      - app_logs:/app/logs

    networks:
      - shared-app-network

    restart: unless-stopped


  # =========================
  # SERVE SERVICE
  # =========================
  serve:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        COMMIT_REF: ${COMMIT_REF:-${GIT_COMMIT:-}}

    container_name: preonsurl-serve

    ports:
      - "127.0.0.1:4983:8878"

    environment:
      SPRING_PROFILES_ACTIVE: serve
      SERVER_PORT: 8878

      COMMIT_REF: ${COMMIT_REF:-${GIT_COMMIT:-}}
      GIT_COMMIT: ${COMMIT_REF:-${GIT_COMMIT:-}}

      LOG_PATH: /app/logs

      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-${MARIADB_DATABASE:-preonsurl}}
      DB_USER: ${MYSQL_USER:-${MARIADB_USER:-preons}}
      DB_PASSWORD: ${MYSQL_PASSWORD:-${MARIADB_PASSWORD:-preonspass}}

      MAILTRAP_API_TOKEN: ${MAILTRAP_API_TOKEN}

      SHORTENER_DOMAIN: https://secure.indexrender.io
      APP_DOMAIN: https://go.indexrender.io
      PSECURE_DOMAIN: https://psecure.indexrender.io

      JWT_SECRET: ${JWT_SECRET}
      SHORTENER_SECRET: ${SHORTENER_SECRET}

      JAVA_OPTS: >-
        -XX:+UseG1GC
        -Xms128m
        -Xmx512m
        -Xss512k
        -XX:MaxMetaspaceSize=160m
        -XX:+ExitOnOutOfMemoryError

    volumes:
      - serve_logs:/app/logs

    networks:
      - shared-app-network

    restart: unless-stopped


  # =========================
  # PSECURE SERVICE
  # =========================
  psecureserve:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        COMMIT_REF: ${COMMIT_REF:-${GIT_COMMIT:-}}

    container_name: preonsurl-psecureserve

    ports:
      - "127.0.0.1:4984:8878"

    environment:
      SPRING_PROFILES_ACTIVE: psecureServe
      SERVER_PORT: 8878

      COMMIT_REF: ${COMMIT_REF:-${GIT_COMMIT:-}}
      GIT_COMMIT: ${COMMIT_REF:-${GIT_COMMIT:-}}

      LOG_PATH: /app/logs

      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-${MARIADB_DATABASE:-preonsurl}}
      DB_USER: ${MYSQL_USER:-${MARIADB_USER:-preons}}
      DB_PASSWORD: ${MYSQL_PASSWORD:-${MARIADB_PASSWORD:-preonspass}}

      MAILTRAP_API_TOKEN: ${MAILTRAP_API_TOKEN}

      SHORTENER_DOMAIN: https://secure.indexrender.io
      APP_DOMAIN: https://go.indexrender.io
      PSECURE_DOMAIN: https://psecure.indexrender.io

      JWT_SECRET: ${JWT_SECRET}
      SHORTENER_SECRET: ${SHORTENER_SECRET}

      JAVA_OPTS: >-
        -XX:+UseG1GC
        -Xms128m
        -Xmx512m
        -Xss512k
        -XX:MaxMetaspaceSize=160m
        -XX:+ExitOnOutOfMemoryError

    volumes:
      - psecure_logs:/app/logs

    networks:
      - shared-app-network

    restart: unless-stopped

# =========================
# VOLUMES
# =========================
volumes:
  app_logs:
    driver: local

  serve_logs:
    driver: local

  psecure_logs:
    driver: local

networks:
  shared-app-network:
    external: true