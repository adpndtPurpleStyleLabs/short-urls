services:

  # =========================
  # APP SERVICE
  # =========================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        COMMIT_REF: ${COMMIT_REF:-${GIT_COMMIT:-}}

    container_name: preonsurl-app

    ports:
      - "127.0.0.1:4982:8878"

    environment:
      SPRING_PROFILES_ACTIVE: app
      SERVER_PORT: 8878

      COMMIT_REF: ${COMMIT_REF:-${GIT_COMMIT:-}}
      GIT_COMMIT: ${COMMIT_REF:-${GIT_COMMIT:-}}

      LOG_PATH: /app/logs

      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${MARIADB_DATABASE}
      DB_USER: ${MARIADB_USER}
      DB_PASSWORD: ${MARIADB_PASSWORD}

      MAILTRAP_API_TOKEN: ${MAILTRAP_API_TOKEN}

      SHORTENER_DOMAIN: https://secure.indexrender.io
      APP_DOMAIN: https://go.indexrender.io
      PSECURE_DOMAIN: https://psecure.indexrender.io

      JWT_SECRET: ${JWT_SECRET}
      SHORTENER_SECRET: ${SHORTENER_SECRET}

      JAVA_OPTS: >-
        -XX:+UseG1GC
        -Xms128m
        -Xmx512m
        -Xss512k
        -XX:MaxMetaspaceSize=160m
        -XX:+ExitOnOutOfMemoryError

    volumes:
      - app_logs:/app/logs

    depends_on:
      mariadb:
        condition: service_healthy

    restart: unless-stopped


  # =========================
  # SERVE SERVICE
  # =========================
  serve:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        COMMIT_REF: ${COMMIT_REF:-${GIT_COMMIT:-}}

    container_name: preonsurl-serve

    ports:
      - "127.0.0.1:4983:8878"

    environment:
      SPRING_PROFILES_ACTIVE: serve
      SERVER_PORT: 8878

      COMMIT_REF: ${COMMIT_REF:-${GIT_COMMIT:-}}
      GIT_COMMIT: ${COMMIT_REF:-${GIT_COMMIT:-}}

      LOG_PATH: /app/logs

      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${MARIADB_DATABASE}
      DB_USER: ${MARIADB_USER}
      DB_PASSWORD: ${MARIADB_PASSWORD}

      MAILTRAP_API_TOKEN: ${MAILTRAP_API_TOKEN}

      SHORTENER_DOMAIN: https://secure.indexrender.io
      APP_DOMAIN: https://go.indexrender.io
      PSECURE_DOMAIN: https://psecure.indexrender.io

      JWT_SECRET: ${JWT_SECRET}
      SHORTENER_SECRET: ${SHORTENER_SECRET}

      JAVA_OPTS: >-
        -XX:+UseG1GC
        -Xms128m
        -Xmx512m
        -Xss512k
        -XX:MaxMetaspaceSize=160m
        -XX:+ExitOnOutOfMemoryError

    volumes:
      - serve_logs:/app/logs

    depends_on:
      mariadb:
        condition: service_healthy

    restart: unless-stopped


  # =========================
  # PSECURE SERVICE
  # =========================
  psecureserve:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        COMMIT_REF: ${COMMIT_REF:-${GIT_COMMIT:-}}

    container_name: preonsurl-psecureserve

    ports:
      - "127.0.0.1:4984:8878"

    environment:
      SPRING_PROFILES_ACTIVE: psecureServe
      SERVER_PORT: 8878

      COMMIT_REF: ${COMMIT_REF:-${GIT_COMMIT:-}}
      GIT_COMMIT: ${COMMIT_REF:-${GIT_COMMIT:-}}

      LOG_PATH: /app/logs

      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${MARIADB_DATABASE}
      DB_USER: ${MARIADB_USER}
      DB_PASSWORD: ${MARIADB_PASSWORD}

      MAILTRAP_API_TOKEN: ${MAILTRAP_API_TOKEN}

      SHORTENER_DOMAIN: https://secure.indexrender.io
      APP_DOMAIN: https://go.indexrender.io
      PSECURE_DOMAIN: https://psecure.indexrender.io

      JWT_SECRET: ${JWT_SECRET}
      SHORTENER_SECRET: ${SHORTENER_SECRET}

      JAVA_OPTS: >-
        -XX:+UseG1GC
        -Xms128m
        -Xmx512m
        -Xss512k
        -XX:MaxMetaspaceSize=160m
        -XX:+ExitOnOutOfMemoryError

    volumes:
      - psecure_logs:/app/logs

    depends_on:
      mariadb:
        condition: service_healthy

    restart: unless-stopped


  # =========================
  # DATABASE
  # =========================
  mariadb:
    image: mariadb:11.4

    container_name: preonsurl-mariadb

    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}

    ports:
      - "127.0.0.1:4981:3306"

    volumes:
      - mariadb_data:/var/lib/mysql
      - ./schema-mariadb.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    healthcheck:
      test:
        [
          "CMD",
          "mariadb-admin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MARIADB_ROOT_PASSWORD}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped


# =========================
# VOLUMES
# =========================
volumes:

  mariadb_data:
    driver: local

  app_logs:
    driver: local

  serve_logs:
    driver: local

  psecure_logs:
    driver: local