# ============================================================
# HTTP -> HTTPS
# ============================================================

server {
    listen 80;
    server_name secure.indexrender.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


server {
    listen 80;
    server_name go.indexrender.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


server {
    listen 80;
    server_name psecure.indexrender.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# ============================================================
# secure.indexrender.io
# ============================================================

server {
    listen 443 ssl;
    http2 on;

    server_name secure.indexrender.io;

    ssl_certificate /etc/letsencrypt/live/secure.indexrender.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/secure.indexrender.io/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://app:8878;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}


